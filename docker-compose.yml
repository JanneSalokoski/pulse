services:
  backend:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      - nginx

  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    command: npm run dev
    ports:
      - "5173:5173"
    depends_on:
      - nginx

  nginx:
    image: nginx:latest
    ports:
      - "8007:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
